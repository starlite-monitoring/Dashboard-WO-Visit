<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring WO Open per Mitra</title>
<style>
  :root{
    --bg:#0a1120;
    --panel:#111b30;
    --panel-2:#0d1626;
    --row-alt:#0f1a2e;
    --line:#20304d;
    --text:#e7edf7;
    --muted:#8798b5;
    --accent:#38bdf8;
    --open:#f5a524;
    --good:#34d399;
    --chip-bg:#16233c;
    --chip-border:#2a3c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 10% -10%, #142140 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #0f1e38 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 1000px; margin: 0 auto; }

  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom: 22px;
  }
  .eyebrow{
    font-size:12px; letter-spacing:3px; color:var(--accent);
    text-transform:uppercase; font-weight:700; margin:0 0 6px;
  }
  h1{ margin:0; font-size: 20px; font-weight:700; }
  .meta{ font-size:12px; color:var(--muted); text-align:right; }
  .meta span{ display:block; }
  #refreshBtn{
    margin-top:6px; background:var(--panel-2); color:var(--accent);
    border:1px solid var(--line); padding:6px 12px; border-radius:8px;
    font-size:12px; cursor:pointer;
  }
  #refreshBtn:hover{ border-color:var(--accent); }

  /* Search di atas hero */
  .hero-search{ margin-bottom: 14px; }
  .hero-search-box{
    max-width: 420px; margin: 0 auto;
    min-width: 0;
  }
  .hero.showing-mitra .value{ color: var(--accent); }
  .hero.not-found .value{ color: var(--muted); font-size:22px; }
  .hero-clear{
    display:none; margin-top:10px; background:var(--panel-2); color:var(--muted);
    border:1px solid var(--line); padding:5px 12px; border-radius:8px;
    font-size:11px; cursor:pointer;
  }
  .hero.showing-mitra .hero-clear{ display:inline-block; }

  /* HERO: Total WO Open All */
  .hero{
    text-align:center;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding: 36px 20px 32px;
    margin-bottom: 22px;
  }
  .hero .label{
    font-size:12px; letter-spacing:3px; color:var(--muted);
    text-transform:uppercase; font-weight:700;
  }
  .hero .value{
    font-size: 76px; font-weight:800; color:var(--open);
    line-height:1.1; margin-top: 8px;
    text-shadow: 0 0 40px rgba(245,165,36,0.25);
  }
  .hero .sub{ margin-top:10px; font-size:12px; color:var(--muted); }

  .panel{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-head h2{ margin:0; font-size:13px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; font-weight:700;}
  .search-box{
    background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding: 6px 12px; display:flex; align-items:center; gap:8px;
    min-width: 220px;
  }
  .search-box svg{ flex-shrink:0; opacity:0.6; }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text);
    font-size:13px; width:100%;
  }
  .search-box input::placeholder{ color:var(--muted); }
  .no-match{ padding: 30px 20px; text-align:center; color:var(--muted); font-size:13px; }

  .col-headers{
    display:grid; grid-template-columns: 34px 1.3fr 0.65fr 0.75fr 0.85fr 2fr;
    padding: 10px 20px; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--line);
    gap: 10px;
  }
  .col-headers .r{ text-align:right; }

  .mitra-card{
    padding: 14px 20px;
    border-bottom:1px solid var(--line);
  }
  .mitra-card:nth-child(even){ background: var(--row-alt); }
  .mitra-card:last-child{ border-bottom:none; }

  .row-top{
    display:grid; grid-template-columns: 34px 1.3fr 0.65fr 0.75fr 0.85fr 2fr;
    align-items:start; gap:10px;
  }
  .rank{ color:var(--muted); font-weight:700; font-size:13px; padding-top:2px; }
  .rank.top{ color:var(--good); }
  .name{ font-weight:600; font-size:14px; padding-top:2px; }
  .station-sub{ font-weight:400; font-size:11px; color:var(--muted); margin-top:3px; }
  .wo{ text-align:right; font-weight:700; color:var(--open); font-size:16px; }
  .over{ text-align:right; font-weight:700; font-size:14px; padding-top:2px; color:var(--muted); }
  .over.has-over{ color:#f87171; }
  .sla{ text-align:right; color:var(--text); font-size:13px; padding-top:2px; }
  .sla.empty{ color:var(--muted); font-style:italic; font-size:12px; }

  .ids-wrap{ }
  .ids-chip-list{
    display:flex; flex-wrap:wrap; gap:6px;
    max-height: 30px; overflow:hidden;
    transition: max-height 0.25s ease;
  }
  .ids-chip-list.expanded{ max-height: 900px; }
  .chip{
    background: var(--chip-bg); border:1px solid var(--chip-border);
    color: var(--accent); font-size:11px; font-weight:600;
    padding: 3px 8px; border-radius:6px; white-space:nowrap;
  }
  .toggle-ids{
    margin-top:6px; background:none; border:none; color:var(--accent);
    font-size:11px; cursor:pointer; padding:0; text-decoration:underline;
  }

  .footnote{ margin-top:14px; font-size:11px; color:var(--muted); line-height:1.6; }
  .mlabel{ display:none; }
  .state{ padding: 40px 20px; text-align:center; color:var(--muted); font-size:13px; }
  .state.error{ color:#f87171; }

  @media (max-width: 700px){
    .topbar{ align-items:center; }
    .col-headers{ display:none; }

    .row-top{
      display:flex;
      flex-wrap:wrap;
      align-items:flex-start;
      column-gap:10px;
      row-gap:10px;
    }
    .rank{ flex: 0 0 22px; font-size:12px; }
    .name{ flex: 1 1 calc(100% - 32px); font-size:14px; }

    .wo, .over{ flex: 1 1 28%; text-align:left; }
    .sla{ flex: 1 1 44%; text-align:left; }

    .mlabel{
      display:block;
      font-size:9px; letter-spacing:0.5px; color:var(--muted);
      text-transform:uppercase; font-weight:600; margin-bottom:2px;
    }

    .ids-wrap{ flex: 1 1 100%; margin-top:2px; }

    .hero{ padding: 28px 16px 26px; }
    .hero .value{ font-size:52px; }
    .search-box{ width:100%; min-width:0; margin-top:10px; }
    .panel-head{ flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <p class="eyebrow">Monitoring WO</p>
      <h1>WO Open per Mitra</h1>
    </div>
    <div class="meta">
      <button id="refreshBtn">Refresh sekarang</button>
    </div>
  </div>

  <div class="hero-search">
    <div class="search-box hero-search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="heroSearchMitra" placeholder="Cari mitra atau stasiun untuk lihat total WO Open-nya..." list="mitraOptions" autocomplete="off">
    </div>
    <datalist id="mitraOptions"></datalist>
  </div>

  <div class="hero" id="heroBox">
    <div class="label" id="heroLabel">Total WO Open All</div>
    <div class="value" id="totalOpenAll">–</div>
    <div class="sub" id="totalMitra">–</div>
    <button class="hero-clear" id="heroClearBtn" type="button">← Kembali ke Total Semua Mitra</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Ranking Mitra</h2>
    </div>
    <div class="col-headers">
      <div>#</div>
      <div>Nama Mitra</div>
      <div class="r">WO Open</div>
      <div class="r">Over SLA</div>
      <div class="r">Rata² SLA</div>
      <div>ID Pelanggan</div>
    </div>
    <div id="tableBody">
      <div class="state">Memuat data dari spreadsheet…</div>
    </div>
  </div>

  <p class="footnote" style="text-align:center; font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:700; color:var(--muted);">
    Dashboard by Vendor Management
  </p>
</div>

<script>
// Daftar sumber CSV yang dicoba berurutan. Kalau yang pertama gagal/timeout/kosong,
// otomatis coba sumber berikutnya — supaya dashboard tidak langsung mati total.
const CSV_SOURCES = [
  // Dicoba duluan: sheet yang (semoga) sudah berisi kolom Station Name & Customer ID.
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2jBfzspPE7Rd8ICB5O9MnRKlWbBA03zMW0EP50ZZE1QBKkOqyEPPalrdBtUK6A2RQAbhjICwzEE9i/pub?gid=585283091&single=true&output=csv",
  // Fallback: sheet lama (LogWorkOrder6) yang sudah terbukti jalan, dipakai otomatis kalau sumber di atas gagal/kosong/salah sheet.
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2jBfzspPE7Rd8ICB5O9MnRKlWbBA03zMW0EP50ZZE1QBKkOqyEPPalrdBtUK6A2RQAbhjICwzEE9i/pub?gid=452104004&single=true&output=csv"
];
const FETCH_TIMEOUT_MS = 15000;

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], n = text[i+1];
    if (inQuotes){
      if (c === '"' && n === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => (f || '').trim() !== ''));
}

function letterToIndex(letters){
  // Mendukung kolom spreadsheet 1 atau 2+ huruf: A=0, B=1, ..., Z=25, AA=26, AL=37, AN=39, AO=40, dst.
  let result = 0;
  const s = letters.toUpperCase();
  for (let i = 0; i < s.length; i++){
    result = result * 26 + (s.charCodeAt(i) - 64);
  }
  return result - 1;
}

// Deteksi kolom otomatis berdasarkan nama header, dengan fallback ke posisi huruf
// tetap (yang sudah terbukti cocok untuk sheet LogWorkOrder6) kalau header tidak ketemu.
// Ini membuat dashboard tidak langsung rusak total kalau struktur sheet sedikit berubah.
function findColumnIndex(headers, keywords, excludeKeywords, fallbackLetter){
  const lower = headers.map(h => (h || '').toLowerCase().trim());
  for (const kw of keywords){
    const idx = lower.findIndex(h =>
      h.includes(kw) && !(excludeKeywords || []).some(ex => h.includes(ex))
    );
    if (idx !== -1) return idx;
  }
  return fallbackLetter ? letterToIndex(fallbackLetter) : -1;
}

const OVER_SLA_HOURS = 24; // WO dianggap "Over SLA" jika usianya lebih dari 24 jam

const OPEN_STATUS_KEYWORDS = [
  'rescheduled',
  'sedang dikerjakan',
  'sudah assign',
  'sudah distribusi'
];

function isOpenStatus(status){
  const s = (status || '').toLowerCase();
  return OPEN_STATUS_KEYWORDS.some(kw => s.includes(kw));
}

function parseSheetDate(str){
  if (!str) return null;
  const d = new Date(str.trim());
  return isNaN(d.getTime()) ? null : d;
}

function extractCustomerId(woNumber){
  if (!woNumber) return null;
  const parts = woNumber.trim().split('-');
  return parts.length > 1 ? parts[parts.length - 1] : woNumber.trim();
}

function formatDuration(hours){
  if (hours < 24) return hours.toFixed(1) + ' jam';
  const days = Math.floor(hours / 24);
  const remHours = Math.round(hours % 24);
  return days + ' hari ' + remHours + ' jam';
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function fetchCsvWithTimeout(url){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), {
      cache: 'no-store',
      signal: controller.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (!text || !text.trim()) throw new Error('Respons kosong');
    return text;
  } finally {
    clearTimeout(timer);
  }
}

function buildStatsFromRows(rows){
  const headers = rows[0] || [];
  const dataRows = rows.slice(1);
  const now = new Date();

  // Deteksi kolom: cari dulu lewat nama header, fallback ke posisi tetap kalau tidak ketemu.
  const COL_WO_NUMBER   = findColumnIndex(headers, ['wo number', 'nomor wo'], [], 'A');
  const COL_CREATED     = findColumnIndex(headers, ['work order created', 'created at', 'wo terbit', 'tanggal terbit'], [], 'B');
  const COL_STATUS      = findColumnIndex(headers, ['status category'], [], 'I');
  const COL_MITRA       = findColumnIndex(headers, ['partner name', 'nama mitra', 'mitra'], ['ikr'], 'T');
  const COL_STATION     = findColumnIndex(headers, ['station name', 'nama stasiun', 'stasiun'], [], null);
  const COL_CUSTOMER_ID = findColumnIndex(headers, ['customer id', 'id pelanggan'], [], null);

  const stats = {};
  const stationStats = {};
  let skippedRows = 0;

  for (const r of dataRows){
    try {
      const mitra = (r[COL_MITRA] || '').trim();
      const statusRaw = (r[COL_STATUS] || '').trim();
      if (!mitra || !statusRaw) continue;
      if (!isOpenStatus(statusRaw)) continue;

      const station = COL_STATION !== -1 ? (r[COL_STATION] || '').trim() : '';
      const rawCustId = COL_CUSTOMER_ID !== -1 ? (r[COL_CUSTOMER_ID] || '').trim() : '';
      const custId = rawCustId || extractCustomerId(r[COL_WO_NUMBER]);

      if (!stats[mitra]) stats[mitra] = { open: 0, slaSum: 0, slaCount: 0, overSla: 0, ids: [], stations: new Set() };
      stats[mitra].open += 1;
      if (custId) stats[mitra].ids.push(custId);
      if (station) stats[mitra].stations.add(station);

      if (station){
        if (!stationStats[station]) stationStats[station] = { open: 0, slaSum: 0, slaCount: 0, overSla: 0, ids: [], mitras: new Set() };
        stationStats[station].open += 1;
        stationStats[station].mitras.add(mitra);
        if (custId) stationStats[station].ids.push(custId);
      }

      const created = parseSheetDate(r[COL_CREATED]);
      if (created){
        const elapsedHours = (now - created) / (1000 * 60 * 60);
        if (elapsedHours >= 0){
          stats[mitra].slaSum += elapsedHours;
          stats[mitra].slaCount += 1;
          if (elapsedHours > OVER_SLA_HOURS) stats[mitra].overSla += 1;
          if (station){
            stationStats[station].slaSum += elapsedHours;
            stationStats[station].slaCount += 1;
            if (elapsedHours > OVER_SLA_HOURS) stationStats[station].overSla += 1;
          }
        }
      }
    } catch (rowErr){
      skippedRows++; // satu baris rusak tidak boleh menjatuhkan seluruh dashboard
    }
  }

  const list = Object.entries(stats)
    .map(([mitra, s]) => ({
      mitra,
      open: s.open,
      overSla: s.overSla,
      slaAvg: s.slaCount > 0 ? (s.slaSum / s.slaCount) : null,
      ids: s.ids,
      stations: Array.from(s.stations)
    }))
    .filter(x => x.open > 0)
    .sort((a, b) => b.open - a.open);

  const stationList = Object.entries(stationStats)
    .map(([station, s]) => ({
      station,
      open: s.open,
      overSla: s.overSla,
      slaAvg: s.slaCount > 0 ? (s.slaSum / s.slaCount) : null,
      ids: s.ids,
      mitras: Array.from(s.mitras)
    }))
    .filter(x => x.open > 0)
    .sort((a, b) => b.open - a.open);

  const totalOpen = list.reduce((a, x) => a + x.open, 0);

  return { list, stationList, totalOpen, skippedRows, rowCount: dataRows.length };
}

async function fetchStatsFromAnySource(){
  let lastError = null;
  let bestAttempt = null; // simpan hasil terbaik walau 0 mitra, buat fallback terakhir

  for (const url of CSV_SOURCES){
    try {
      const text = await fetchCsvWithTimeout(url);
      const rows = parseCSV(text);
      if (rows.length < 2){
        lastError = new Error('Data dari sumber ini kosong');
        continue;
      }
      const result = buildStatsFromRows(rows);
      if (result.list.length > 0){
        return result; // sumber ini valid dan ada datanya, langsung pakai
      }
      // sumber ini bisa diakses tapi 0 mitra cocok (kemungkinan sheet/kolom salah) -> coba sumber lain dulu
      if (!bestAttempt) bestAttempt = result;
    } catch (err){
      lastError = err;
    }
  }

  if (bestAttempt) return bestAttempt; // semua sumber gagal dapat data, tampilkan hasil terbaik yang ada (meski kosong)
  throw lastError || new Error('Semua sumber data gagal diakses');
}

async function loadDashboard(){
  const body = document.getElementById('tableBody');
  body.innerHTML = '<div class="state">Memuat data dari spreadsheet…</div>';
  try {
    const { list, stationList, totalOpen } = await fetchStatsFromAnySource();

    window.__mitraList = list;
    window.__stationList = stationList;
    window.__totalOpen = totalOpen;

    const datalist = document.getElementById('mitraOptions');
    datalist.innerHTML =
      list.map(x => '<option value="' + escapeHtml(x.mitra) + '">').join('') +
      stationList.map(x => '<option value="' + escapeHtml(x.station) + '">').join('');

    document.getElementById('totalMitra').textContent = list.length + ' mitra memiliki WO Open';

    if (list.length === 0){
      body.innerHTML = '<div class="state">Tidak ada WO berstatus Open saat ini.</div>';
      return;
    }

    body.innerHTML = list.map((x, i) => {
      const isTop = i === 0;
      const slaText = x.slaAvg !== null
        ? formatDuration(x.slaAvg)
        : '<span class="sla empty">n/a</span>';

      const CHIP_LIMIT_ROWS = 4; // ~ perkiraan chip yang muat di 1 baris sebelum di-collapse
      const chips = x.ids.map(id => '<span class="chip">' + escapeHtml(id) + '</span>').join('');
      const needsToggle = x.ids.length > CHIP_LIMIT_ROWS;
      const overText = x.overSla > 0 ? x.overSla : '–';
      const overClass = x.overSla > 0 ? 'over has-over' : 'over';

      const stationsAttr = x.stations.map(s => s.toLowerCase()).join(',');
      const stationPreview = x.stations.length > 3
        ? x.stations.slice(0, 3).join(', ') + ' +' + (x.stations.length - 3) + ' lainnya'
        : x.stations.join(', ');

      return '<div class="mitra-card" data-name="' + escapeHtml(x.mitra.toLowerCase()) + '" data-stations="' + escapeHtml(stationsAttr) + '">' +
        '<div class="row-top">' +
          '<div class="rank ' + (isTop ? 'top' : '') + '">' + (i + 1) + '</div>' +
          '<div class="name">' + escapeHtml(x.mitra) +
            (stationPreview ? '<div class="station-sub">Stasiun: ' + escapeHtml(stationPreview) + '</div>' : '') +
          '</div>' +
          '<div class="wo"><span class="mlabel">WO Open</span>' + x.open + '</div>' +
          '<div class="' + overClass + '"><span class="mlabel">Over SLA</span>' + overText + '</div>' +
          '<div class="sla"><span class="mlabel">Rata² SLA</span>' + slaText + '</div>' +
          '<div class="ids-wrap">' +
            '<div class="ids-chip-list">' + chips + '</div>' +
            (needsToggle ? '<button class="toggle-ids" type="button">Lihat semua ID (' + x.ids.length + ')</button>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // toggle expand/collapse per mitra
    body.querySelectorAll('.toggle-ids').forEach(btn => {
      btn.addEventListener('click', () => {
        const list = btn.previousElementSibling;
        const expanded = list.classList.toggle('expanded');
        const count = list.querySelectorAll('.chip').length;
        btn.textContent = expanded ? 'Sembunyikan ID' : 'Lihat semua ID (' + count + ')';
      });
    });

    updateHeroFromSearch();

  } catch (err){
    const isTimeout = err && err.name === 'AbortError';
    const msg = isTimeout
      ? 'Koneksi ke spreadsheet terlalu lama (timeout). Periksa koneksi internet, lalu coba lagi.'
      : 'Gagal memuat data (' + (err && err.message ? err.message : 'tidak diketahui') + '). Pastikan spreadsheet masih dipublish ke web, lalu coba lagi.';
    body.innerHTML =
      '<div class="state error">' + escapeHtml(msg) +
      '<br><button id="retryBtn" type="button" style="margin-top:10px; background:var(--panel-2); color:var(--accent); border:1px solid var(--line); padding:6px 14px; border-radius:8px; font-size:12px; cursor:pointer;">Coba lagi</button>' +
      '</div>';
    const retryBtn = document.getElementById('retryBtn');
    if (retryBtn) retryBtn.addEventListener('click', loadDashboard);
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

function filterRankingList(q){
  const cards = document.querySelectorAll('.mitra-card');
  let visibleCount = 0;
  cards.forEach(card => {
    const name = card.getAttribute('data-name') || '';
    const stations = card.getAttribute('data-stations') || '';
    const match = !q || name.includes(q) || stations.includes(q);
    card.style.display = match ? '' : 'none';
    if (match) visibleCount++;
  });
  const existingNoMatch = document.getElementById('noMatchState');
  if (visibleCount === 0 && cards.length > 0){
    if (!existingNoMatch){
      const el = document.createElement('div');
      el.id = 'noMatchState';
      el.className = 'no-match';
      el.textContent = 'Tidak ada mitra/stasiun yang cocok dengan pencarian.';
      document.getElementById('tableBody').appendChild(el);
    }
  } else if (existingNoMatch){
    existingNoMatch.remove();
  }
}

function updateHeroFromSearch(){
  const heroBox = document.getElementById('heroBox');
  const heroLabel = document.getElementById('heroLabel');
  const totalEl = document.getElementById('totalOpenAll');
  const subEl = document.getElementById('totalMitra');
  const q = (document.getElementById('heroSearchMitra').value || '').trim().toLowerCase();
  const list = window.__mitraList || [];
  const stationList = window.__stationList || [];

  if (!q){
    heroBox.classList.remove('showing-mitra', 'not-found');
    heroLabel.textContent = 'Total WO Open All';
    totalEl.textContent = (window.__totalOpen || 0).toLocaleString('id-ID');
    subEl.textContent = list.length + ' mitra memiliki WO Open';
    filterRankingList('');
    return;
  }

  // 1. cari exact match nama Mitra dulu, kalau tidak ada, cari partial match
  let match = list.find(x => x.mitra.toLowerCase() === q);
  if (!match){
    const partial = list.filter(x => x.mitra.toLowerCase().includes(q));
    if (partial.length === 1) match = partial[0];
    else if (partial.length > 1){
      heroBox.classList.add('showing-mitra');
      heroBox.classList.remove('not-found');
      heroLabel.textContent = partial.length + ' mitra cocok, pilih dari saran';
      totalEl.textContent = partial.reduce((a, x) => a + x.open, 0).toLocaleString('id-ID');
      subEl.textContent = partial.map(x => x.mitra).join(', ');
      filterRankingList(q);
      return;
    }
  }

  if (match){
    heroBox.classList.add('showing-mitra');
    heroBox.classList.remove('not-found');
    heroLabel.textContent = 'Total WO Open — ' + match.mitra;
    totalEl.textContent = match.open.toLocaleString('id-ID');
    subEl.textContent = (match.overSla > 0 ? match.overSla + ' WO over SLA · ' : '') +
      (match.slaAvg !== null ? 'Rata² SLA ' + formatDuration(match.slaAvg) : 'Rata² SLA n/a');
    filterRankingList(match.mitra.toLowerCase());
    return;
  }

  // 2. tidak ketemu di nama Mitra, coba cari di nama Stasiun
  let stationMatch = stationList.find(x => x.station.toLowerCase() === q);
  if (!stationMatch){
    const partialStation = stationList.filter(x => x.station.toLowerCase().includes(q));
    if (partialStation.length === 1) stationMatch = partialStation[0];
    else if (partialStation.length > 1){
      heroBox.classList.add('showing-mitra');
      heroBox.classList.remove('not-found');
      heroLabel.textContent = partialStation.length + ' stasiun cocok, pilih dari saran';
      totalEl.textContent = partialStation.reduce((a, x) => a + x.open, 0).toLocaleString('id-ID');
      subEl.textContent = partialStation.map(x => x.station).join(', ');
      filterRankingList(q);
      return;
    }
  }

  if (stationMatch){
    heroBox.classList.add('showing-mitra');
    heroBox.classList.remove('not-found');
    heroLabel.textContent = 'Total WO Open — Stasiun ' + stationMatch.station;
    totalEl.textContent = stationMatch.open.toLocaleString('id-ID');
    subEl.textContent = (stationMatch.overSla > 0 ? stationMatch.overSla + ' WO over SLA · ' : '') +
      (stationMatch.slaAvg !== null ? 'Rata² SLA ' + formatDuration(stationMatch.slaAvg) + ' · ' : '') +
      'Mitra: ' + stationMatch.mitras.join(', ');
    filterRankingList(q);
    return;
  }

  // 3. benar-benar tidak ketemu
  heroBox.classList.add('showing-mitra', 'not-found');
  heroLabel.textContent = 'Mitra / Stasiun tidak ditemukan';
  totalEl.textContent = '–';
  subEl.textContent = 'Coba kata kunci lain';
  filterRankingList(q);
}

document.getElementById('heroSearchMitra').addEventListener('input', updateHeroFromSearch);
document.getElementById('heroClearBtn').addEventListener('click', () => {
  document.getElementById('heroSearchMitra').value = '';
  updateHeroFromSearch();
});

loadDashboard();
setInterval(loadDashboard, 5 * 60 * 1000);
</script>
